<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Add User</title>
  </head>

  <body class="bg-[#101010] text-white min-h-screen">
    <main class="w-full min-h-screen p-3">
      <!-- ================= FORM ================= -->

      <form
        autocomplete="off"
        class="w-[400px] max-w-full mx-auto p-6 bg-[#252525] border border-[#444] rounded-xl"
      >
        <!-- Heading -->
        <h1 class="text-2xl font-bold text-center mb-6">Add User</h1>

        <!-- Name -->
        <div class="mb-5">
          <label for="name" class="block text-sm mb-2"> Name </label>

          <input
            type="text"
            id="name"
            name="name"
            class="w-full p-2.5 bg-[#3a3a3a] border border-[#444] rounded-md outline-none text-white focus:border-gray-500"
          />
        </div>

        <!-- Role -->
        <div class="mb-5">
          <label for="role" class="block text-sm mb-2"> Role </label>

          <input
            type="text"
            id="role"
            name="role"
            class="w-full p-2.5 bg-[#3a3a3a] border border-[#444] rounded-md outline-none text-white focus:border-gray-500"
          />
        </div>

        <!-- Bio -->
        <div class="mb-5">
          <label for="bio" class="block text-sm mb-2"> Bio </label>

          <textarea
            id="bio"
            name="bio"
            rows="3"
            class="w-full p-2.5 bg-[#3a3a3a] border border-[#444] rounded-md outline-none text-white resize-none focus:border-gray-500"
          ></textarea>
        </div>

        <!-- Photo URL -->
        <div class="mb-5">
          <label for="photo" class="block text-sm mb-2"> Photo URL </label>

          <input
            type="url"
            id="photo"
            name="photo"
            class="w-full p-2.5 bg-[#3a3a3a] border border-[#444] rounded-md outline-none text-white focus:border-gray-500"
          />
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          class="w-full p-3 border border-[#444] rounded-md cursor-pointer hover:bg-[#333] transition"
        >
          Submit
        </button>
      </form>
      <div
        class="users grid grid-cols-1 md:grid-cols-3 gap-10 px-6 max-w-6xl mx-auto"
      ></div>
    </main>

    <!-- JavaScript -->
    <script src="script.js"></script>
  </body>
</html>
